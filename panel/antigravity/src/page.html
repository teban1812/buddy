<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buddy</title>
<style>
:root{color-scheme:light dark;--fg:var(--color-text-primary,light-dark(#1f2328,#e6edf3));--dim:var(--color-text-secondary,light-dark(#6a737d,#8b949e));--line:var(--color-border-primary,light-dark(#8c959f,#6e7681));--accent:var(--color-text-info,light-dark(#0969da,#4493f8))}
body{font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:transparent;margin:0;padding:12px}
section{margin-bottom:16px}h2{font-size:13px;margin:0 0 6px}.dim{color:var(--dim)}.w{margin:6px 0}.bar{font-family:ui-monospace,monospace;letter-spacing:1px}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:6px;padding:2px 10px;cursor:pointer}button.p{border-color:var(--accent);color:var(--accent);margin-top:3px}
footer{display:flex;gap:8px;align-items:center}
/* the open milestone's bar: the board page's colours (core/src/board.mjs), light and dark */
.mbar{display:flex;height:10px;max-width:320px;border-radius:5px;overflow:hidden;margin:2px 0 4px;background:light-dark(#eeeeec,#2a2a2e)}.mbar span{display:block}
.s-done{background:light-dark(#23744a,#5cc98a)}.s-owner{background:light-dark(#9a5100,#ffa940)}.s-agent{background:light-dark(#2461c4,#6ea2ff)}.s-define{background:light-dark(#85858d,#9a9aa2)}
</style></head><body><div id="root"><p class="dim">…</p></div><div id="status" role="status" aria-live="polite" class="dim"></div><!--script--></body></html>
